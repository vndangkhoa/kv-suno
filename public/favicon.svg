<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Suno Studio Wiki</title>
  <desc id="desc">Terminal-inspired music note with a neon audio waveform</desc>
  <defs>
    <linearGradient id="bg" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#142238"/>
      <stop offset="1" stop-color="#071015"/>
    </linearGradient>
    <linearGradient id="wave" x1="12" y1="32" x2="53" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3fb950"/>
      <stop offset=".52" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="#050a0e"/>
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <circle cx="13" cy="13" r="3" fill="#ff7b72"/>
  <circle cx="22" cy="13" r="3" fill="#d29922"/>
  <circle cx="31" cy="13" r="3" fill="#3fb950"/>
  <path d="M12 25h8" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M18 25v15.5a5 5 0 1 1-2.5-4.3V20l13-3v15.5a5 5 0 1 1-2.5-4.3V13l-8 2v10" fill="none" stroke="#c9d1d9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M39 40V28m6 17V22m6 23V29m6 10v-7" stroke="url(#wave)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M39 40V28m6 17V22m6 23V29m6 10v-7" stroke="url(#wave)" stroke-width="1.5" stroke-linecap="round"/>
</svg>